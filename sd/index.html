<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularz kontaktowy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Formularz kontaktowy</h1>


        <form id="contactForm" action="odbierz.php" method="post" novalidate>
            <div class="form-group">
                <label for="imie">Imię *</label>
                <input type="text" id="imie" name="imie" required minlength="2" placeholder="Jan">
                <span class="error-msg" id="imieError"></span>
            </div>
           <div class="form-group">
                <label for="nazwisko">nazwisko *</label>
                <input type="text" id="nazwisko" name="nazwisko" required minlength="2" placeholder="Kowalski">
                <span class="error-msg" id="nazwiskoError"></span>
            </div>
            <div class="form-group">
                <label for="email">email *</label>
                <input type="email" id="email" name="email" required minlength="2" placeholder="jan.kowalski@gmail.com">
                <span class="error-msg" id="emailError"></span>
            </div>
            <button type="submit">Wyslij formularz</button>
            <button type="reset">Wyczysc formularz</button>
        </form>

        <div id="powitanie" class="welcome-msg"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
